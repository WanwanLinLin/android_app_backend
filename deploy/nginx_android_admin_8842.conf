# 数字人资源管理后台（admin console）—— 8842
# 前端 dist 静态托管 + /v1 反向代理到本机后端 8852
# 部署：2026-11-16；回滚：删除本文件后 nginx -s reload 即可，不影响其它站点
server {
    listen 8842;
    server_name _;

    root /data/hbh/cproject/IndustrialPark/dist;
    index index.html;

    access_log /var/log/nginx/android_admin_8842.access.log;
    error_log  /var/log/nginx/android_admin_8842.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端 API（含 LLM 自动化测试同步运行，单次可达分钟级，超时放宽）
    location /v1/ {
        proxy_pass http://127.0.0.1:8852;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 带内容 hash 的构建产物：长缓存，发版即换新文件名自动失效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 为 hash 路由，index.html 不缓存保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
